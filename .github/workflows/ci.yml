name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: pip install -r contracts/requirements.txt
      - run: python contracts/check_mock.py
      - run: python contracts/check_mock.py contracts/real/floci-estate.infra.json

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [estate, extractor, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements.txt
      - run: pip install -r apps/${{ matrix.app }}/requirements.txt
      - run: python -m compileall -q apps/${{ matrix.app }}

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [site, phone]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
