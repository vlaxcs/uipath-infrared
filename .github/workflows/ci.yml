name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: [self-hosted, linux, infrared]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Secrets in the whole git history
        run: gitleaks git --redact --no-banner .

  contracts:
    runs-on: [self-hosted, linux, infrared]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Python environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r contracts/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Mock, forecast, catalog and run examples
        run: python contracts/check_mock.py
      - name: Contract tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s contracts -p "test_*.py"
      - name: Real Floci extraction
        if: ${{ !cancelled() }}
        run: python contracts/check_mock.py contracts/real/floci-estate.infra.json

  python:
    runs-on: [self-hosted, linux, infrared]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [estate, extractor, agent, engine, sandbox, pricing]
    steps:
      - uses: actions/checkout@v4
      - name: Tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Python environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r apps/${{ matrix.app }}/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Compile
        run: python -m compileall -q apps/${{ matrix.app }}
      - name: Tests
        if: ${{ hashFiles(format('apps/{0}/tests/**', matrix.app)) != '' }}
        working-directory: apps/${{ matrix.app }}
        run: python -m pytest -q

  site-store:
    runs-on: [self-hosted, linux, infrared]
    timeout-minutes: 10
    services:
      sites-db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: sites
          POSTGRES_USER: sites_admin
          POSTGRES_PASSWORD: sites_admin
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U sites_admin -d sites"
          --health-interval 2s
          --health-retries 30
    env:
      SITES_TEST_ADMIN_URL: postgresql://sites_admin:sites_admin@127.0.0.1:54329/sites
      SITES_TEST_DATABASE_URL: postgresql://site_step_login:site_step@127.0.0.1:54329/sites
    steps:
      - uses: actions/checkout@v4
      - name: Tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Python environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r apps/agent/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Migrations
        run: |
          for file in apps/agent/migrations/*.sql apps/agent/migrations/local/*.sql; do
            python -c 'import pathlib, sys, psycopg; psycopg.connect(sys.argv[1], autocommit=True).execute(pathlib.Path(sys.argv[2]).read_text())' "$SITES_TEST_ADMIN_URL" "$file"
          done
      - name: Store tests
        working-directory: apps/agent
        run: python -m pytest -q tests/test_site_store.py -p no:cacheprovider -rs

  orchestrator:
    runs-on: [self-hosted, linux, infrared]
    timeout-minutes: 15
    services:
      app-db:
        image: postgres:17
        env:
          POSTGRES_DB: infrared
          POSTGRES_USER: infrared
          POSTGRES_PASSWORD: infrared
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U infrared -d infrared"
          --health-interval 2s
          --health-retries 30
    env:
      ORCHESTRATOR_TEST_DATABASE_URL: postgres://infrared:infrared@127.0.0.1:54330/infrared
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/orchestrator/go.mod
          cache-dependency-path: apps/orchestrator/go.sum
      - name: Tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Python environment for the engine and the contract checker
        working-directory: .
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r apps/engine/requirements.txt -r contracts/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: Unit tests and the flow test
        if: ${{ !cancelled() }}
        run: go test ./... -count=1

  web:
    runs-on: [self-hosted, linux, infrared]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [site, phone, dashboard, slack-bot]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint --if-present
      - name: Types
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
