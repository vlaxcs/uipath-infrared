  @media (prefers-color-scheme: dark) {

      --bg:#0f141b; --panel:#171e28; --ink:#e6ebf2; --muted:#93a1b3; --line:#2b3644;
      --shop:#6b9cff; --data:#a78bfa; --legacy:#ff9d5c; --dev:#4fd1c0; --shared:#8b97a8;
      --idle:#f2c14e; --orphan:#ff6b9a; --exposed:#ff6b9a;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f141b; --panel:#171e28; --ink:#e6ebf2; --muted:#93a1b3; --line:#2b3644;
    --shop:#6b9cff; --data:#a78bfa; --legacy:#ff9d5c; --dev:#4fd1c0; --shared:#8b97a8;
    --idle:#f2c14e; --orphan:#ff6b9a; --exposed:#ff6b9a;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display:grid; grid-template-columns: 250px 1fr 300px; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:14px 16px; overflow:auto; }
  #detail { border-right:0; border-left:1px solid var(--line); }
  h1 { font-size:15px; margin:0 0 2px; }
  h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:18px 0 6px; font-weight:600; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:10px; }
  label.row, div.row { display:flex; align-items:center; gap:8px; padding:2px 0; cursor:pointer; }
  .sw { width:11px; height:11px; border-radius:3px; flex:none; }
  input[type=search] { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  button { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; padding:4px 9px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--muted); }
  #stage { position:relative; min-width:0; }
  svg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  svg.panning { cursor:grabbing; }
  .edge { fill:none; stroke:var(--muted); stroke-opacity:.45; }
  .edge.hl { stroke-opacity:1; stroke-width:2.2; }
  .edge.dim, .node.dim { opacity:.08; }
  .node { cursor:pointer; }
  .node text { fill:var(--ink); font-size:10.5px; paint-order:stroke; stroke:var(--bg); stroke-width:3px; pointer-events:none; }
  .halo { fill:none; stroke-width:2.2; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px; }
  .kv span:nth-child(odd) { color:var(--muted); }
  .badge { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; border:1px solid currentColor; }
  .conn { padding:3px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .conn:hover { color:var(--shop); }
  #tip { position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12px; display:none; z-index:5; }
  .legend-shape { width:14px; height:14px; flex:none; }
  @media (max-width: 900px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } aside { border:0; border-bottom:1px solid var(--line); max-height:34vh; } #detail { border-top:1px solid var(--line); max-height:30vh; } }
</style>
</head>

    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button id="reheat">Re-layout</button><button id="fit">Fit view</button><button id="theme">Theme</button></div>
    <h2>Shapes</h2><div id="shapes"></div>

</div>

svg.addEventListener("click", ev => { if (ev.target === svg && state.sel) { state.sel = null; applyFocus(null); document.getElementById("detail").innerHTML = '<div class="sub">Click a node to inspect it.</div>'; } });

addEventListener("resize", () => { size(); });
init(); for (let i = 0; i < 260; i++) step(); alpha = .3; fit(); tick(); setTimeout(fit, 900);
</script>
