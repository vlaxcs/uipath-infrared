KINDS.forEach(k => { const b = document.createElement("button"); b.className = "kind" + (state.kinds.has(k) ? "" : " off"); b.innerHTML = `<i style="background:var(--k-${k})"></i>${k}`;
  b.onclick = () => { state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k); b.classList.toggle("off"); draw(); }; kinds.appendChild(b); });
$("q").oninput = e => { state.q = e.target.value.toLowerCase().trim(); refresh(); };
$("all").onclick = e => { state.all = !state.all; e.target.classList.toggle("on", state.all); kinds.classList.toggle("show", state.all); layout(); };
$("theme").onclick = () => { const r = document.documentElement, dark = (r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark"; r.dataset.theme = dark ? "light" : "dark"; };

// ---------- selection & focus ----------
const focus = () => state.sel || state.hov;
const nbrs = n => { const s = new Set([n.id]); edges.forEach(e => { if (e.s === n) s.add(e.t.id); if (e.t === n) s.add(e.s.id); }); return s; };
const matches = n => (!state.status || n.status === state.status) && (!state.q || (n.id + " " + n.type + " " + n.stack + " " + JSON.stringify(n.attrs)).toLowerCase().includes(state.q));
function refresh() {
  const f = focus(), nb = f ? nbrs(f) : null, filtering = !!(state.status || state.q); let shown = 0;
  document.querySelectorAll(".kpi").forEach(k => k.classList.toggle("on", k.dataset.s === (state.status || "")));
  nodes.forEach(n => { if (!n.el) return; const m = matches(n); if (m) shown++;
    n.el.classList.toggle("dim", f ? !nb.has(n.id) : filtering && !m); n.el.classList.toggle("sel", n === state.sel); n.el.classList.toggle("nb", !!f && n !== f && nb.has(n.id)); });
  $("empty").style.display = filtering && !shown ? "block" : "none"; draw();
}
function hover(n) { state.hov = n; if (!state.sel) refresh(); }
function select(n) {
  state.sel = n; $("wrap").classList.toggle("panel", !!n); $("drawer").classList.toggle("open", !!n);
  if (n) { if (n.tier) n.tier.classList.remove("closed"); renderDrawer(n); }
  refresh(); layout(); if (n && n.el) n.el.scrollIntoView({block:"nearest", behavior:"smooth"});
}
function renderDrawer(n) {
  const outs = edges.filter(e => e.s === n), ins = edges.filter(e => e.t === n), col = TIERS.find(t => t[0] === TIER_OF(n.category));
  const dep = (e, o) => `<div class="dep" data-id="${esc(o.id)}"><span class="kp" style="--kc:var(--k-${e.kind})">${e.kind}</span><div><span class="dn mono">${esc(o.label)}</span> <span class="tag" style="--tc:var(--muted)">${TAG[o.type] || esc(o.type)}</span>${e.note ? `<small>${esc(e.note)}</small>` : ""}</div></div>`;
  const attrs = Object.entries(n.attrs).filter(([, v]) => v !== null && v !== undefined && v !== "").map(([k, v]) => `<span>${esc(k)}</span><span>${typeof v === "object" ? "<code>" + esc(JSON.stringify(v)) + "</code>" : esc(v)}</span>`).join("");
  $("drawer").innerHTML = `<button class="x" aria-label="Close">×</button><span class="tag" style="--tc:var(${col ? col[2] : "--muted"})">${TAG[n.type] || esc(n.type)}</span>
    <h2 class="mono">${esc(n.label)}</h2><div class="meta">${esc(n.type)} · stack <b style="color:var(--s-${n.stack})">${esc(n.stack)}</b> · ${STATUS[n.status]}</div>
    ${why(n) ? `<div class="why ${n.status}">${esc(why(n))}</div>` : ""}
    <h3>Attributes</h3><div class="kv">${attrs || "<span>–</span><span></span>"}</div>
    <h3>Depends on (${outs.length})</h3>${outs.map(e => dep(e, e.t)).join("") || '<div class="meta">Nothing</div>'}
    <h3>Used by (${ins.length})</h3>${ins.map(e => dep(e, e.s)).join("") || '<div class="meta">Nothing</div>'}`;
  $("drawer").scrollTop = 0; $("drawer").querySelector(".x").onclick = () => select(null);
  $("drawer").querySelectorAll(".dep").forEach(d => d.onclick = () => select(byId[d.dataset.id]));
}
$("wrap").addEventListener("click", ev => { if (state.sel && !ev.target.closest(".res,.head.node")) select(null); });
addEventListener("keydown", ev => { if (ev.key === "Escape" && state.sel) select(null); });

// ---------- links ----------
const svg = $("links"), lg = $("lg"), NS = "http://www.w3.org/2000/svg";
const mk = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
KINDS.forEach(k => { const m = mk("marker", {id:"m-" + k, viewBox:"0 0 10 10", refX:9, refY:5, markerWidth:7, markerHeight:7, orient:"auto"}, svg.querySelector("defs")); mk("path", {d:"M0,1 L10,5 L0,9 Z", style:`fill:var(--k-${k})`}, m); });
function rectOf(n) {
  let el = n.el; if (!el || el.offsetParent === null || (n.tier && n.tier.classList.contains("closed"))) el = n.anchor;
  if (!el) return null; const b = el.getBoundingClientRect(), w = board.getBoundingClientRect();
  return {l:b.left - w.left, r:b.right - w.left, y:b.top - w.top + b.height / 2};
}
function path(a, b, i) {
  if (b.l > a.r - 6) { const dx = Math.max(40, (b.l - a.r) / 2); return [`M${a.r},${a.y} C${a.r + dx},${a.y} ${b.l - dx},${b.y} ${b.l},${b.y}`, (a.r + b.l) / 2, (a.y + b.y) / 2, true]; }
  if (b.r < a.l + 6) { const dx = Math.max(40, (a.l - b.r) / 2); return [`M${a.l},${a.y} C${a.l - dx},${a.y} ${b.r + dx},${b.y} ${b.r},${b.y}`, (a.l + b.r) / 2, (a.y + b.y) / 2, true]; }
  const rail = Math.min(a.l, b.l) - 5 - (i % 4) * 3, r = 5, sy = Math.sign(b.y - a.y) || 1;   // same column: elbow connector on a rail
  return [`M${a.l},${a.y} H${rail + r} Q${rail},${a.y} ${rail},${a.y + sy * r} V${b.y - sy * r} Q${rail},${b.y} ${rail + r},${b.y} H${b.l}`, rail, (a.y + b.y) / 2, false];
}
function draw() {
  lg.innerHTML = ""; const f = focus(), list = [];
  if (f) edges.forEach(e => { if (e.s === f || e.t === f) list.push([e, true]); });
  if (state.all) edges.forEach(e => { if (state.kinds.has(e.kind) && !(f && (e.s === f || e.t === f))) list.push([e, false]); });
  const label = list.length <= 14;
  list.forEach(([e, hot], i) => { const a = rectOf(e.s), b = rectOf(e.t); if (!a || !b) return; const [d, mx, my, lab] = path(a, b, i);
    mk("path", {d, fill:"none", style:`stroke:var(--k-${e.kind})`, "stroke-width":hot ? 2.2 : 1.2, "stroke-opacity":hot ? (state.sel ? .95 : .7) : .3, "stroke-dasharray":e.kind === "config" ? "5 4" : "", "marker-end":`url(#m-${e.kind})`}, lg);
    if (hot && label && lab) { const t = mk("text", {x:mx, y:my - 5, "text-anchor":"middle", style:`font-size:10.5px;font-weight:600;fill:var(--k-${e.kind});paint-order:stroke;stroke:var(--bg);stroke-width:4px`}, lg); t.textContent = e.kind; } });
}
function layout() { requestAnimationFrame(draw); }
addEventListener("resize", layout); new ResizeObserver(layout).observe(board);
refresh();
</script>
