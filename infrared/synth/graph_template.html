<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfraRed Estate</title>
<style>
  :root {

    --idle:#b97a00; --idle-bg:#fff3d6; --orphan:#c2255c; --orphan-bg:#ffe3ee; --exposed:#c92a2a; --exposed-bg:#ffe0e0; --ok:#2b8a3e;
    --c-edge:#0e8fb3; --c-compute:#2f6fdb; --c-data:#7a4fd6; --c-messaging:#12907f; --c-storage:#6b7686; --c-network:#4a8f2f; --c-iam:#a2653a;
    --s-shop-prod:#2f6fdb; --s-data-platform:#7a4fd6; --s-legacy:#d9742b; --s-dev:#12907f; --s-shared:#6b7686;
    --k-traffic:#e8590c; --k-data:#7a4fd6; --k-event:#12907f; --k-dns:#c9a100; --k-config:#7a8699; --k-network:#2f6fdb; --k-contains:#98a2b3;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0e1218; --surface:#161c25; --surface2:#1b222d; --ink:#e7ebf2; --muted:#8e9aac; --line:#273040; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
    --idle:#f2c14e; --idle-bg:#3a2e0d; --orphan:#ff7aa6; --orphan-bg:#3d1626; --exposed:#ff8080; --exposed-bg:#431a1a; --ok:#6fcf86;
    --c-edge:#4cc3e6; --c-compute:#6b9cff; --c-data:#a78bfa; --c-messaging:#4fd1c0; --c-storage:#98a3b5; --c-network:#8bd16c; --c-iam:#e0a077;
    --s-shop-prod:#6b9cff; --s-data-platform:#a78bfa; --s-legacy:#ff9d5c; --s-dev:#4fd1c0; --s-shared:#98a3b5;
    --k-traffic:#ff8a4c; --k-data:#a78bfa; --k-event:#4fd1c0; --k-dns:#f2d04e; --k-config:#9aa6b8; --k-network:#6b9cff; --k-contains:#6d7787; } }
  :root[data-theme="dark"] { --bg:#0e1218; --surface:#161c25; --surface2:#1b222d; --ink:#e7ebf2; --muted:#8e9aac; --line:#273040; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
    --idle:#f2c14e; --idle-bg:#3a2e0d; --orphan:#ff7aa6; --orphan-bg:#3d1626; --exposed:#ff8080; --exposed-bg:#431a1a; --ok:#6fcf86;
    --c-edge:#4cc3e6; --c-compute:#6b9cff; --c-data:#a78bfa; --c-messaging:#4fd1c0; --c-storage:#98a3b5; --c-network:#8bd16c; --c-iam:#e0a077;
    --s-shop-prod:#6b9cff; --s-data-platform:#a78bfa; --s-legacy:#ff9d5c; --s-dev:#4fd1c0; --s-shared:#98a3b5;
    --k-traffic:#ff8a4c; --k-data:#a78bfa; --k-event:#4fd1c0; --k-dns:#f2d04e; --k-config:#9aa6b8; --k-network:#6b9cff; --k-contains:#6d7787; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  button, input { font:inherit; color:inherit; }
  header { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 22px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; letter-spacing:-.01em; } h1 b { color:#e5484d; }
  .meta { color:var(--muted); font-size:12px; }
  .kpis { display:flex; gap:8px; flex-wrap:wrap; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px 12px; cursor:pointer; box-shadow:var(--shadow); text-align:left; min-width:92px; }
  .kpi small { display:block; color:var(--muted); font-size:11px; }
  .kpi strong { font-size:18px; line-height:1.1; }
  .kpi.on { outline:2px solid var(--ink); outline-offset:1px; }
  .kpi[data-s=idle] strong { color:var(--idle); } .kpi[data-s=orphan] strong { color:var(--orphan); } .kpi[data-s=exposed] strong { color:var(--exposed); }
  .spacer { flex:1; }
  #q { width:210px; padding:7px 11px; border:1px solid var(--line); border-radius:8px; background:var(--surface); outline:none; }
  #q:focus { border-color:var(--muted); }
  .btn { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 11px; cursor:pointer; }
  .btn:hover { border-color:var(--muted); } .btn.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  #kinds { display:none; gap:6px; flex-wrap:wrap; width:100%; align-items:center; font-size:12px; color:var(--muted); }
  #kinds.show { display:flex; }
  .kind { display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border:1px solid var(--line); border-radius:999px; background:var(--surface); cursor:pointer; color:var(--ink); }
  .kind i { width:14px; height:3px; border-radius:2px; display:block; } .kind.off { opacity:.45; }

  #wrap { position:relative; padding:18px 22px 60px; transition:padding-right .2s; } #wrap.panel { padding-right:372px; }
  #board { position:relative; display:grid; grid-template-columns:repeat(auto-fit, minmax(290px, 1fr)); gap:16px; align-items:start; }
  #links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; overflow:visible; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .head { padding:12px 14px; border-top:4px solid var(--sc); display:flex; flex-direction:column; gap:2px; cursor:default; }
  .head.node { cursor:pointer; } .head.node:hover { background:var(--surface2); }
  .head .top { display:flex; align-items:center; gap:8px; }
  .head h2 { margin:0; font-size:14.5px; } .head .sub { color:var(--muted); font-size:12px; }
  .tag { display:inline-block; font:600 10px/1 ui-monospace, Menlo, monospace; letter-spacing:.04em; text-transform:uppercase; padding:3px 5px; border-radius:4px; color:var(--tc); background:color-mix(in srgb, var(--tc) 14%, transparent); flex:none; }
  .tier { padding:2px 10px 10px; }
  .tier > .th { display:flex; align-items:center; gap:6px; width:100%; background:none; border:0; padding:8px 4px 5px; cursor:pointer; color:var(--muted); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; font-weight:600; text-align:left; }
  .tier > .th::before { content:""; width:7px; height:7px; border-radius:2px; background:var(--tc); }
  .tier > .th .n { margin-left:auto; font-weight:500; letter-spacing:0; } .tier > .th .car { font-size:9px; transition:transform .15s; } .tier.closed > .th .car { transform:rotate(-90deg); }
  .tier.closed .items { display:none; }
  .items { display:flex; flex-direction:column; gap:5px; }
  .res { display:grid; grid-template-columns:auto 1fr auto; gap:2px 8px; align-items:center; padding:6px 9px; border:1px solid var(--line); border-left:3px solid var(--tc); border-radius:8px; background:var(--surface2); cursor:pointer; transition:opacity .15s, box-shadow .15s, border-color .15s; }
  .res:hover { border-color:var(--muted); border-left-color:var(--tc); }
  .res .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .res .facts { grid-column:1 / -1; color:var(--muted); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:1px; }
  .res.sel { box-shadow:0 0 0 2px var(--ink); } .res.dim, .head.dim { opacity:.28; } .res.nb { box-shadow:0 0 0 1.5px var(--muted); }
  .pill { font-size:10px; font-weight:700; letter-spacing:.04em; padding:2px 6px; border-radius:999px; text-transform:uppercase; }
  .pill.idle { color:var(--idle); background:var(--idle-bg); } .pill.orphan { color:var(--orphan); background:var(--orphan-bg); } .pill.exposed { color:var(--exposed); background:var(--exposed-bg); }
  .empty { display:none; padding:40px; text-align:center; color:var(--muted); }

  #drawer { position:fixed; top:var(--hh,70px); right:0; width:360px; height:calc(100vh - var(--hh,70px)); background:var(--surface); border-left:1px solid var(--line); box-shadow:-10px 0 30px rgba(0,0,0,.08); z-index:30; transform:translateX(100%); transition:transform .22s ease; overflow:auto; padding:18px 18px 40px; }
  #drawer.open { transform:none; }
  #drawer h2 { margin:8px 0 2px; font-size:17px; word-break:break-all; }
  #drawer h3 { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:20px 0 7px; font-weight:600; }
  .x { position:absolute; right:12px; top:10px; border:0; background:none; font-size:22px; cursor:pointer; color:var(--muted); }
  .why { margin:10px 0 0; padding:8px 10px; border-radius:8px; font-size:12px; }
  .why.idle { background:var(--idle-bg); color:var(--idle); } .why.orphan { background:var(--orphan-bg); color:var(--orphan); } .why.exposed { background:var(--exposed-bg); color:var(--exposed); }
  .kv { display:grid; grid-template-columns:minmax(80px,auto) 1fr; gap:4px 12px; font-size:12px; } .kv span:nth-child(odd) { color:var(--muted); } .kv code { font-size:11px; word-break:break-all; }
  .dep { display:flex; gap:8px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .dep:hover .dn { text-decoration:underline; } .dep .dn { font-weight:600; word-break:break-all; } .dep small { display:block; color:var(--muted); font-size:11px; }
  .kp { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 6px; border-radius:4px; color:var(--kc); background:color-mix(in srgb, var(--kc) 14%, transparent); flex:none; margin-top:1px; min-width:52px; text-align:center; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface); }
  .seg button { border:0; background:none; padding:6px 13px; cursor:pointer; color:var(--muted); } .seg button.on { background:var(--ink); color:var(--bg); }
  #gv { position:fixed; left:0; right:0; bottom:0; top:var(--hh,70px); background:var(--bg); transition:right .2s; } #gv.panel { right:360px; } #gv[hidden] { display:none; }
  #gsvg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; } #gsvg.panning { cursor:grabbing; }
  .gn { cursor:pointer; } .gn text { pointer-events:none; } .gn .tg { fill:#fff; font:700 8px ui-monospace, Menlo, monospace; text-anchor:middle; dominant-baseline:central; }
  .gn .lb { fill:var(--ink); font-size:11px; text-anchor:middle; paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
  .gn .ring { fill:none; stroke-width:2.6; } .gn .ring.idle { stroke:var(--idle); stroke-dasharray:4 3; } .gn .ring.orphan { stroke:var(--orphan); stroke-dasharray:1.5 3; stroke-linecap:round; } .gn .ring.exposed { stroke:var(--exposed); }
  .gn.dim, .ge.dim { opacity:.12; } .gn.sel .core { stroke:var(--ink); stroke-width:3; } .gn .core { stroke:var(--bg); stroke-width:2; }
  .gh text { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; text-anchor:middle; }
  .gtools { position:absolute; left:18px; top:14px; display:flex; gap:6px; } .gtools .btn { box-shadow:var(--shadow); }
  .legend { position:absolute; left:18px; bottom:16px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:9px 12px; font-size:11.5px; display:grid; grid-template-columns:repeat(2, auto); gap:3px 18px; color:var(--muted); }
  .legend span { display:flex; align-items:center; gap:7px; } .legend i { width:10px; height:10px; border-radius:50%; display:block; flex:none; } .legend i.r { background:none; border:2px solid; width:12px; height:12px; }
  @media (max-width:900px) { #gv.panel { right:0; bottom:55vh; } }
  @media (max-width:900px) { #wrap.panel { padding-right:22px; } #drawer { width:100%; height:55vh; top:auto; bottom:0; border-left:0; border-top:1px solid var(--line); transform:translateY(100%); } #drawer.open { transform:none; } }
</style>
</head>
<body>
<header id="hdr">
  <div><h1>Infra<b>Red</b> · estate</h1><div class="meta" id="meta"></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="spacer"></div>
  <div class="seg" id="seg" role="tablist"><button data-m="diagram">Diagram</button><button data-m="graph">Graph</button></div>
  <input id="q" type="search" placeholder="Search name, type, attribute…" aria-label="Search">
  <button class="btn" id="all" title="Draw every link instead of only the selected resource's">All links</button>
  <button class="btn" id="theme">Theme</button>
  <div id="kinds"><span>Link kinds:</span></div>
</header>
<div id="wrap">
  <div id="board"></div>
  <svg id="links"><defs></defs><g id="lg"></g></svg>
  <div class="empty" id="empty">No resources match.</div>
</div>
<div id="gv" hidden>
  <svg id="gsvg" aria-label="Dependency graph"><defs id="gdefs"></defs><g id="gvp"><g id="ghulls"></g><g id="gedges"></g><g id="gnodes"></g><g id="glabels"></g></g></svg>
  <div class="gtools"><button class="btn" id="gfit">Fit</button><button class="btn" id="grelayout">Re-layout</button><button class="btn on" id="glabelbtn">Labels</button></div>
  <div class="legend" id="legend"></div>
</div>
<aside id="drawer" aria-live="polite"></aside>
<script>
const G = /*__GRAPH__*/null;

const STACKS = ["shop-prod","data-platform","legacy","dev","shared"];
const TIERS = [["edge","Edge & DNS","--c-edge"],["compute","Compute","--c-compute"],["data","Data stores","--c-data"],["messaging","Messaging & events","--c-messaging"],
  ["storage","Storage","--c-storage"],["network","Network & security","--c-network"],["iam","Identity & registry","--c-iam"]];
const TIER_OF = c => c === "registry" ? "iam" : c;
const KINDS = ["traffic","data","event","dns","config","network","contains"];
const STATUS = {active:"Healthy", idle:"Idle", orphan:"Orphan", exposed:"Exposed"};
const TAG = {vpc:"VPC", sg:"SG", nat:"NAT", eip:"EIP", eks:"EKS", ecs:"ECS", "ecs-svc":"SVC", asg:"ASG", ec2:"EC2", lambda:"λ", alb:"ALB", dns:"DNS", rds:"RDS", "rds-cluster":"AURORA",
  cache:"CACHE", ddb:"DDB", s3:"S3", efs:"EFS", sqs:"SQS", sns:"SNS", kinesis:"KIN", firehose:"FH", rule:"RULE", "iam-role":"IAM", ecr:"ECR", ebs:"EBS"};
const FACT_KEYS = [["instance_type",""],["cls",""],["node_type",""],["engine",""],["version","v"],["runtime",""],["cidr",""],["shards","shards "],["key","key "],["size_gb","GB "],["backlog","backlog "],["desired","desired "]];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const nodes = G.nodes.map(n => ({...n}));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = G.edges.filter(e => byId[e.src] && byId[e.dst]).map(e => ({...e, s:byId[e.src], t:byId[e.dst]}));
const vpcOf = Object.fromEntries(nodes.filter(n => n.type === "vpc").map(n => [n.stack, n]));
let mode = location.hash === "#graph" ? "graph" : "diagram";
const gstate = {kinds:new Set(KINDS), labels:true, view:{x:0, y:0, k:1}, alpha:0, built:false, drag:null, pan:null, running:false};
const state = {sel:null, hov:null, status:null, q:"", all:false, kinds:new Set(["traffic","data","event","dns","config"]), closed:new Set(["iam"])};

function facts(n) {
  const out = []; for (const [k, p] of FACT_KEYS) { const v = n.attrs[k]; if (v !== null && v !== undefined && v !== "" && typeof v !== "object") out.push(p + v); if (out.length === 2) break; }
  const cpu = n.attrs.cpu_avg_24h ?? n.attrs.node_cpu_avg_24h; if (cpu !== null && cpu !== undefined) out.push(`CPU ${cpu}%`);
  if (n.attrs.open_to_world && n.attrs.open_to_world.length) out.push("open " + n.attrs.open_to_world.map(p => p.replace(/^tcp:/, "")).join(", "));
  if (n.attrs.public_policy) out.push("public bucket policy"); if (n.attrs.public) out.push("publicly accessible");
  return out.join(" · ");
}
function why(n) {
  const a = n.attrs, cpu = a.cpu_avg_24h ?? a.node_cpu_avg_24h;
  if (n.status === "idle") return a.connections_avg_24h !== undefined ? `Idle: ${a.connections_avg_24h} avg connections over 24h.` : a.bytes_out_per_hour !== undefined ? `Idle: ${a.bytes_out_per_hour ?? 0} bytes/h out over 24h.` : cpu !== null && cpu !== undefined ? `Idle: ${cpu}% average CPU over 24h.` : "Idle: low observed utilisation.";
  if (n.status === "orphan") return "Orphan: not attached to anything, still billed.";
  if (n.status === "exposed") return a.open_to_world ? `Exposed: open to 0.0.0.0/0 on ${a.open_to_world.join(", ")}.` : "Exposed: reachable from the public internet.";
  return "";
}

// ---------- board ----------
const board = $("board");
STACKS.forEach(st => {
  const list = nodes.filter(n => n.stack === st && n.type !== "vpc"); const vpc = vpcOf[st]; if (!list.length && !vpc) return;
  const card = document.createElement("section"); card.className = "card"; card.style.setProperty("--sc", `var(--s-${st})`);
  const head = document.createElement("div"); head.className = "head" + (vpc ? " node" : "");
  head.innerHTML = `<div class="top">${vpc ? '<span class="tag" style="--tc:var(--sc)">VPC</span>' : ""}<h2>${esc(st)}</h2></div><div class="sub mono">${vpc ? esc(vpc.attrs.cidr) + " · " + esc(vpc.attrs.id) + " · " : ""}${list.length} resources</div>`;
  if (vpc) { vpc.el = head; vpc.anchor = head; head.onclick = ev => { ev.stopPropagation(); select(vpc); }; head.onmouseenter = () => hover(vpc); head.onmouseleave = () => hover(null); }
  card.appendChild(head);
  TIERS.forEach(([cat, title, col]) => {
    const items = list.filter(n => TIER_OF(n.category) === cat).sort((a, b) => a.type.localeCompare(b.type) || a.label.localeCompare(b.label)); if (!items.length) return;
    const tier = document.createElement("div"); tier.className = "tier" + (state.closed.has(cat) ? " closed" : ""); tier.style.setProperty("--tc", `var(${col})`);
    const th = document.createElement("button"); th.className = "th"; th.innerHTML = `<span class="car">▼</span>${title}<span class="n">${items.length}</span>`;
    th.onclick = () => { tier.classList.toggle("closed"); layout(); }; tier.appendChild(th);
    const box = document.createElement("div"); box.className = "items";
    items.forEach(n => {
      const r = document.createElement("div"); r.className = "res"; r.tabIndex = 0; r.title = n.id; n.el = r; n.anchor = th; n.tier = tier;
      r.innerHTML = `<span class="tag" style="--tc:var(${col})">${TAG[n.type] || esc(n.type)}</span><span class="nm">${esc(n.label)}</span>${n.status !== "active" ? `<span class="pill ${n.status}">${STATUS[n.status]}</span>` : "<span></span>"}<span class="facts">${esc(facts(n)) || "&nbsp;"}</span>`;
      r.onclick = ev => { ev.stopPropagation(); select(n); }; r.onkeydown = ev => { if (ev.key === "Enter") select(n); };
      r.onmouseenter = () => hover(n); r.onmouseleave = () => hover(null); box.appendChild(r);
    });
    tier.appendChild(box); card.appendChild(tier);
  });
  board.appendChild(card);
});

// ---------- header ----------
$("meta").textContent = `${nodes.length} resources · ${edges.length} dependencies · built ${G.generated.replace("T", " ").replace("+00:00", " UTC")}`;
const kp = $("kpis");
[["", "Resources", nodes.length], ["idle", "Idle", nodes.filter(n => n.status === "idle").length], ["orphan", "Orphans", nodes.filter(n => n.status === "orphan").length], ["exposed", "Exposed", nodes.filter(n => n.status === "exposed").length]].forEach(([s, l, c]) => {
  const b = document.createElement("button"); b.className = "kpi"; b.dataset.s = s; b.innerHTML = `<small>${l}</small><strong>${c}</strong>`;
  b.onclick = () => { state.status = !s || state.status === s ? null : s; refresh(); }; kp.appendChild(b); });
const kinds = $("kinds"), activeKinds = () => mode === "graph" ? gstate.kinds : state.kinds;
function buildKinds() {
  kinds.querySelectorAll(".kind").forEach(b => b.remove());
  KINDS.forEach(k => { const b = document.createElement("button"); b.className = "kind" + (activeKinds().has(k) ? "" : " off"); b.innerHTML = `<i style="background:var(--k-${k})"></i>${k}`;
    b.onclick = () => { const set = activeKinds(); set.has(k) ? set.delete(k) : set.add(k); b.classList.toggle("off"); mode === "graph" ? gUpdate() : draw(); }; kinds.appendChild(b); });
}
$("q").oninput = e => { state.q = e.target.value.toLowerCase().trim(); refresh(); };
$("all").onclick = e => { state.all = !state.all; e.target.classList.toggle("on", state.all); syncChrome(); layout(); };
$("theme").onclick = () => { const r = document.documentElement, dark = (r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark"; r.dataset.theme = dark ? "light" : "dark"; };

// ---------- selection & focus ----------
const focus = () => state.sel || state.hov;
const nbrs = n => { const s = new Set([n.id]); edges.forEach(e => { if (e.s === n) s.add(e.t.id); if (e.t === n) s.add(e.s.id); }); return s; };
const matches = n => (!state.status || n.status === state.status) && (!state.q || (n.id + " " + n.type + " " + n.stack + " " + JSON.stringify(n.attrs)).toLowerCase().includes(state.q));
function refresh() {
  const f = focus(), nb = f ? nbrs(f) : null, filtering = !!(state.status || state.q); let shown = 0;
